<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VERUMLEX AI — Repertorio Commercial v1.0</title>
    <style>
        :root {
            --bg-canvas: #ffffff;
            --ultramarine-deep: #0f2d59;
            --carbon-dense: #1a1a1a;
            --slate-titanium: #64748b;
            --border-light: rgba(15, 45, 89, 0.08);
            --font-premium: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-canvas);
            font-family: var(--font-premium);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Cintillo Superior Premium */
        .master-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
            border-bottom: 1px solid var(--border-light);
            background: #ffffff;
            height: 75px;
            flex-shrink: 0;
        }

        .brand-logo {
            font-size: 38px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--ultramarine-deep);
            font-family: sans-serif;
            user-select: none;
        }

        .header-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .control-pill-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 45, 89, 0.02);
            border: 1px solid var(--border-light);
            padding: 6px 14px;
            border-radius: 20px;
        }

        .pill-label {
            font-size: 11px;
            font-weight: 800;
            color: var(--slate-titanium);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .dropdown-premium {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            color: var(--ultramarine-deep);
            outline: none;
            cursor: pointer;
        }

        /* Arquitectura Panorámica de 3 Fajas Elásticas Core */
        .workspace-canvas {
            flex: 1;
            display: flex;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .panel-left {
            width: 22%;
            min-width: 15%;
            max-width: 40%;
            background: #ffffff;
            border-right: 1px solid var(--border-light);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        .panel-center {
            flex: 1;
            background: #ffffff;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .panel-right {
            width: 28%;
            min-width: 20%;
            max-width: 45%;
            background: var(--carbon-dense);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
            color: #ffffff;
        }

        .panel-title-left {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: var(--ultramarine-deep);
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
        }

        .panel-title-right {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #ffffff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 12px;
        }

        .btn-upload-premium {
            background: #ffffff;
            border: 2px solid var(--carbon-dense);
            color: var(--carbon-dense);
            padding: 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            text-align: center;
        }

        .btn-upload-premium:hover {
            background: var(--ultramarine-deep);
            color: #ffffff;
            border-color: var(--ultramarine-deep);
        }

        .role-status-bar {
            font-size: 12px;
            font-weight: 700;
            color: var(--slate-titanium);
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-shrink: 0;
        }

        .conversation-stream {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Barra Gemini Inferior Estilizada Horizontal Fija */
        .gemini-control-pod {
            display: flex;
            align-items: center;
            background: rgba(15, 45, 89, 0.02);
            border: 2px solid var(--ultramarine-deep);
            border-radius: 28px;
            padding: 6px 16px;
            gap: 12px;
            margin-top: 16px;
            flex-shrink: 0;
            width: 100%;
        }

        .clip-icon {
            font-size: 18px;
            cursor: pointer;
            color: var(--slate-titanium);
            user-select: none;
        }

        .kernel-input {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: #000000;
            font-size: 14px;
            font-family: var(--font-premium);
        }

        .btn-execute-premium {
            background: var(--ultramarine-deep);
            border: none;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-execute-premium:hover {
            background: #1d4ed8;
        }

        /* Divisores Elásticos */
        .resizer {
            width: 8px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 10;
            flex-shrink: 0;
        }

        .resizer:hover, .resizer.active {
            background: rgba(15, 45, 89, 0.05);
        }

        .log-content {
            font-size: 12px;
            font-family: monospace;
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <!-- CINTILLO SUPERIOR MANDATARIO -->
    <header class="master-header">
        <div class="brand-logo">VERUMLEX AI</div>
        <div class="header-controls">
            <div class="control-pill-group">
                <span class="pill-label" id="lblLang">Language</span>
                <select class="dropdown-premium" id="langSelector">
                    <option value="ES" selected>ES</option>
                    <option value="EN">EN</option>
                    <option value="PT">PT</option>
                    <option value="ZH">ZH</option>
                    <option value="DE">DE</option>
                </select>
            </div>
            <div class="control-pill-group">
                <span class="pill-label" id="lblRole">Role</span>
                <select class="dropdown-premium" id="rangeDiscriminator">
                    <option value="PROFESIONAL" selected>Modo Profesional</option>
                    <option value="CORPORATIVO">Modo Corporativo</option>
                    <option value="ESTUDIANTE">Modo Estudiante</option>
                </select>
            </div>
        </div>
    </header>

    <!-- ARQUITECTURA PANORÁMICA DE TRES FAJAS EQUILIBRADAS -->
    <div class="workspace-canvas">
        
        <!-- Faja Izquierda: Fuentes de Información -->
        <main class="panel-left" id="panelLeft">
            <div class="panel-title-left" id="lblFuentes">Fuentes / Archivos</div>
            <div>
                <button class="btn-upload-premium" id="btnUpload">Upload de Fuentes y Datos</button>
                <input type="file" id="fileInput" style="display: none;" multiple>
            </div>
        </main>

        <div class="resizer" id="resizerLeft"></div>

        <!-- Faja Central Workspace: Contenedor Jerárquico Hermético -->
        <main class="panel-center" id="panelCenter">
            <div class="role-status-bar" id="lblStatus">Ecosistema serverless de peso cero. El sistema permanece en modo pasivo listo para el acoplamiento de las matrices de red globales.</div>
            <div class="conversation-stream" id="centerWorkspace"></div>
            
            <footer class="gemini-control-pod">
                <div class="clip-icon" id="clipBtn">📎</div>
                <input type="text" class="kernel-input" id="kernelInput" placeholder="Inyectar instrucción o comando al núcleo corporativo..." autocomplete="off">
                <button class="btn-execute-premium" id="execBtn">EJECUTAR</button>
            </footer>
        </main>

        <div class="resizer" id="resizerRight"></div>

        <!-- Faja Derecha: Escritorio Log -->
        <aside class="panel-right" id="panelRight">
            <div class="panel-title-right" id="lblDesktop">Desktop / Escritorio</div>
            <div class="log-content" id="rightLogZone">RESUMENES / ESCRITOS</div>
        </aside>
    </div>

    <!-- SCRIPT DE CONTROL ELÁSTICO E IDIOMAS -->
    <script>
        const INTERFACE_LOCALIZATION = {
            ES: { fuentes: "Fuentes / Archivos", upload: "Upload de Fuentes y Datos", status: "Ecosistema serverless de peso cero. El sistema permanece en modo pasivo.", desktop: "Desktop / Escritorio", inputPlaceholder: "Inyectar instrucción o comando al núcleo corporativo..." },
            EN: { fuentes: "Sources / Files", upload: "Upload Sources and Data", status: "Zero-weight serverless ecosystem. System remains in passive mode.", desktop: "Desktop / Workspace", inputPlaceholder: "Inject instruction or command into corporate core..." },
            PT: { fuentes: "Fontes / Arquivos", upload: "Upload de Fontes e Dados", status: "Ecossistema serverless de peso zero. O sistema permanece em modo passivo.", desktop: "Desktop / Área de Trabalho", inputPlaceholder: "Injetar instrução ou comando no núcleo corporativo..." },
            ZH: { fuentes: "来源 / 文件", upload: "上传来源和数据", status: "零重量无服务器生态系统。系统保持被动模式。", desktop: "桌面 / 工作区", inputPlaceholder: "向企业核心注入指令..." },
            DE: { fuentes: "Quellen / Dateien", upload: "Quellen und Daten hochladen", status: "Gewichtsneutrales serverless Ökosystem. System bleibt im passiven Modus.", desktop: "Desktop / Arbeitsbereich", inputPlaceholder: "Anweisung oder Befehl in den Corporate Core einspeisen..." }
        };

        const langSelect = document.getElementById("langSelector");
        const roleSelect = document.getElementById("rangeDiscriminator");
        const cmdInput = document.getElementById("kernelInput");
        const chatHistory = document.getElementById("centerWorkspace");
        const execBtn = document.getElementById("execBtn");

        const updateUI = () => {
            const lang = langSelect.value;
            const dict = INTERFACE_LOCALIZATION[lang] || INTERFACE_LOCALIZATION.ES;
            document.getElementById("lblFuentes").innerText = dict.fuentes;
            document.getElementById("btnUpload").innerText = dict.upload;
            document.getElementById("lblStatus").innerText = `${roleSelect.value} // ${dict.status}`;
            document.getElementById("lblDesktop").innerText = dict.desktop;
            cmdInput.placeholder = dict.inputPlaceholder;
        };

        langSelect.addEventListener("change", updateUI);
        roleSelect.addEventListener("change", updateUI);

        const setupResizer = (resizerId, panelId, isRight = false) => {
            const resizer = document.getElementById(resizerId);
            const panel = document.getElementById(panelId);
            if (!resizer || !panel) return;
            resizer.addEventListener("mousedown", (e) => {
                e.preventDefault(); resizer.classList.add("active");
                const doDrag = (moveEvent) => {
                    if (!isRight) {
                        const newWidth = (moveEvent.clientX / window.innerWidth) * 100;
                        if (newWidth > 12 && newWidth < 40) panel.style.width = `${newWidth}%`;
                    } else {
                        const newWidth = ((window.innerWidth - moveEvent.clientX) / window.innerWidth) * 100;
                        if (newWidth > 18 && newWidth < 45) panel.style.width = `${newWidth}%`;
                    }
                };
                const stopDrag = () => {
                    resizer.classList.remove("active");
                    document.removeEventListener("mousemove", doDrag);
                    document.removeEventListener("mouseup", stopDrag);
                };
                document.addEventListener("mousemove", doDrag);
                document.addEventListener("mouseup", stopDrag);
            });
        };
        setupResizer("resizerLeft", "panelLeft");
        setupResizer("resizerRight", "panelRight", true);

        const clipBtn = document.getElementById("clipBtn");
        const fileInput = document.getElementById("fileInput");
        if (clipBtn && fileInput) { clipBtn.addEventListener("click", () => fileInput.click()); }
    </script>
</body>
</html>
